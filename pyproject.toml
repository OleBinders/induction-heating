[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "induction-heating"
version = "0.1.0"
description = "Scientific desktop application for calculating and visualizing induction heating effects using analytical methods"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "pint>=0.23",
    "pydantic>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
induction-heating = "induction_heating.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/induction_heating"]
